name: Deploy Signed APK to Cloudflare R2

on:
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run android:build

      - name: Build Android Release APK
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        id: sign_app
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Decode keystore
          echo "$SIGNING_KEY" | base64 --decode > pasona-release-key.jks
          
          # Find the newest apksigner
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name zipalign | sort -r | head -n 1)
          
          APK_PATH="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="frontend/android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="frontend/android/app/build/outputs/apk/release/app-release-signed.apk"
          
          # Align
          $ZIPALIGN -v -p 4 $APK_PATH $ALIGNED_APK
          
          # Sign
          $APKSIGNER sign --ks pasona-release-key.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$KEY_STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out $SIGNED_APK \
            $ALIGNED_APK
            
          echo "signedReleaseFile=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Generate metadata.json
        run: |
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          SIZE_BYTES=$(wc -c < "$SIGNED_APK")
          # Convert bytes to MB with 1 decimal place
          SIZE_MB=$(echo "scale=1; $SIZE_BYTES / 1048576" | bc)
          
          # Use jq to safely encode the JSON
          jq -n \
            --arg version "${{ github.event.release.tag_name }}" \
            --arg size "${SIZE_MB} MB" \
            --arg whatsNew "${{ github.event.release.body }}" \
            '{version: $version, size: $size, whatsNew: $whatsNew}' > metadata.json
            
          cat metadata.json

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          
          # Upload the signed APK
          aws s3 cp "$SIGNED_APK" \
            s3://${{ secrets.R2_BUCKET_NAME }}/pasona.apk \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --region auto \
            --content-type "application/vnd.android.package-archive"
            
          # Upload the metadata
          aws s3 cp metadata.json \
            s3://${{ secrets.R2_BUCKET_NAME }}/metadata.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --region auto \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"
