<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1230" />
    <title>Pasona — Personal Finance</title>
    <meta name="description" content="Personal finance — track accounts, transactions, and spending." />
    <meta name="author" content="Pasona" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pasona" />
    <meta property="og:title" content="Pasona" />
    <meta property="og:description" content="Personal finance — track accounts, transactions, and spending." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@Pasona" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Sora:wght@300;400;500;600;700&display=swap" />
    <style>
      /* Critical: paint background before any JS/CSS loads to prevent black flash */
      html, body {
        background-color: #0A1230;
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        height: 100dvh;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 3rem 1.5rem;
        user-select: none;
        background: radial-gradient(circle at 50% 35%, #182459 0%, transparent 65%), #0A1230;
        box-sizing: border-box;
      }
      .initial-spacer { height: 2.25rem; width: 2.25rem; }
      .initial-logo { height: 2rem; width: auto; object-fit: contain; }
      .initial-spinner-container { padding-bottom: 1rem; }
      .initial-spinner {
        height: 2.25rem;
        width: 2.25rem;
        color: #3b82f6;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @media (min-width: 640px) { .initial-spinner-container { padding-bottom: 1.5rem; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash">
        <div class="initial-spacer"></div>
        <div style="display: flex; flex-direction: column; align-items: center;">
          <img src="/img/brand-name-logo-dark.png" alt="Pasona" class="initial-logo" />
        </div>
        <div class="initial-spinner-container">
          <svg class="initial-spinner" viewBox="0 0 40 40" fill="currentColor">
            <circle cx="20" cy="7" r="3.5" opacity="1"></circle>
            <circle cx="29.2" cy="10.8" r="3.1" opacity="0.85"></circle>
            <circle cx="33" cy="20" r="2.7" opacity="0.7"></circle>
            <circle cx="29.2" cy="29.2" r="2.3" opacity="0.55"></circle>
            <circle cx="20" cy="33" r="2.0" opacity="0.4"></circle>
            <circle cx="10.8" cy="29.2" r="1.7" opacity="0.28"></circle>
            <circle cx="7" cy="20" r="1.4" opacity="0.18"></circle>
            <circle cx="10.8" cy="10.8" r="1.2" opacity="0.1"></circle>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
